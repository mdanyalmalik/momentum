<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E7CF0"/>
      <stop offset="1" stop-color="#3B3FB8"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- tilted slightly upward: forward progress -->
  <g transform="translate(512 512) scale(0.92) translate(-512 -512) translate(-10 30) rotate(-14 512 512)" stroke-linecap="round" fill="none" stroke="#FFFFFF">
    <!-- motion trails, fading and shortening behind the ball -->
    <line x1="240" y1="430" x2="468" y2="430" stroke-width="56" opacity="0.95"/>
    <line x1="300" y1="526" x2="430" y2="526" stroke-width="56" opacity="0.65"/>
    <line x1="370" y1="622" x2="468" y2="622" stroke-width="56" opacity="0.38"/>
    <!-- the ball -->
    <circle cx="640" cy="526" r="140" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
